services:
  course2video:
    build:
      context: .
      args:
        EXTRAS: math,piper,docling
    volumes:
      - ./out:/data/out
    depends_on: [ollama]

  ollama:
    image: ollama/ollama:0.40.14
    volumes:
      - ollama:/root/.ollama
    ports: ["127.0.0.1:11434:11434"]

volumes:
  ollama:
